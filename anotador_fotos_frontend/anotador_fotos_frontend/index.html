<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; padding:0; background:transparent; font-family: -apple-system, sans-serif; }
  #toolbar { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  button, select {
    background:#262730; color:#fafafa; border:1px solid #555; border-radius:6px;
    padding:7px 10px; font-size:13px; cursor:pointer;
  }
  button:hover { background:#3a3b45; }
  button.activo { background:#FF4B4B; border-color:#FF4B4B; }
  button.guardar { background:#21c45d; border-color:#21c45d; font-weight:bold; }
  #canvasWrap { border:1px solid #444; touch-action:none; line-height:0; }
  canvas { display:block; touch-action:none; width:100%; height:auto; }
  #estado { font-size:12px; color:#9a9a9a; margin-top:4px; }
</style>
</head>
<body>
  <div id="toolbar">
    <button data-tool="circle" class="activo">⭕ Círculo</button>
    <button data-tool="rect">🔲 Rectángulo</button>
    <button data-tool="line">↗️ Flecha</button>
    <button data-tool="freedraw">✏️ Libre</button>
    <button id="btnDeshacer">↩️ Deshacer</button>
    <button id="btnLimpiar">🗑️ Borrar todo</button>
    <button id="btnGuardar" class="guardar">💾 Guardar anotación</button>
  </div>
  <div id="canvasWrap">
    <canvas id="lienzo"></canvas>
  </div>
  <div id="estado"></div>

<script>
// ---- Protocolo de comunicacion con Streamlit (sin librerias externas) ----
function enviarAStreamlit(tipo, datos) {
  window.parent.postMessage(Object.assign({ type: tipo }, datos), "*");
}
function marcarListo() { enviarAStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function ajustarAltura(alto) { enviarAStreamlit("streamlit:setFrameHeight", { height: alto }); }
function enviarValor(valor) { enviarAStreamlit("streamlit:setComponentValue", { value: valor, dataType: "json" }); }

const canvas = document.getElementById("lienzo");
const ctx = canvas.getContext("2d");
const estadoEl = document.getElementById("estado");

let imagenFondo = null;
let formas = [];
let formaActual = null;
let dibujando = false;
let herramienta = "circle";

function redibujar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (imagenFondo) {
    ctx.drawImage(imagenFondo, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#eeeeee";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  formas.concat(formaActual ? [formaActual] : []).forEach(dibujarForma);
}

function dibujarForma(f) {
  if (!f) return;
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#FF0000";
  ctx.fillStyle = "rgba(255,0,0,0.2)";
  if (f.tipo === "circle") {
    const cx = (f.x1 + f.x2) / 2, cy = (f.y1 + f.y2) / 2;
    const rx = Math.abs(f.x2 - f.x1) / 2, ry = Math.abs(f.y2 - f.y1) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
    ctx.fill(); ctx.stroke();
  } else if (f.tipo === "rect") {
    ctx.beginPath();
    ctx.rect(f.x1, f.y1, f.x2 - f.x1, f.y2 - f.y1);
    ctx.fill(); ctx.stroke();
  } else if (f.tipo === "line") {
    dibujarFlecha(f.x1, f.y1, f.x2, f.y2);
  } else if (f.tipo === "freedraw") {
    ctx.beginPath();
    f.puntos.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }
}

function dibujarFlecha(x1, y1, x2, y2) {
  const angulo = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  const tam = 12;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - tam * Math.cos(angulo - Math.PI / 6), y2 - tam * Math.sin(angulo - Math.PI / 6));
  ctx.lineTo(x2 - tam * Math.cos(angulo + Math.PI / 6), y2 - tam * Math.sin(angulo + Math.PI / 6));
  ctx.closePath();
  ctx.fillStyle = "#FF0000";
  ctx.fill();
}

function coordsDesdeEvento(ev) {
  const rect = canvas.getBoundingClientRect();
  const escalaX = canvas.width / rect.width;
  const escalaY = canvas.height / rect.height;
  const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
  const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
  return { x: (cx - rect.left) * escalaX, y: (cy - rect.top) * escalaY };
}

function empezarDibujo(ev) {
  ev.preventDefault();
  dibujando = true;
  const { x, y } = coordsDesdeEvento(ev);
  formaActual = herramienta === "freedraw"
    ? { tipo: "freedraw", puntos: [{ x, y }] }
    : { tipo: herramienta, x1: x, y1: y, x2: x, y2: y };
}

function seguirDibujo(ev) {
  if (!dibujando) return;
  ev.preventDefault();
  const { x, y } = coordsDesdeEvento(ev);
  if (herramienta === "freedraw") formaActual.puntos.push({ x, y });
  else { formaActual.x2 = x; formaActual.y2 = y; }
  redibujar();
}

function terminarDibujo() {
  if (!dibujando) return;
  dibujando = false;
  if (formaActual) formas.push(formaActual);
  formaActual = null;
  redibujar();
  estadoEl.textContent = "Sin guardar - presiona 'Guardar anotación' cuando termines";
}

canvas.addEventListener("mousedown", empezarDibujo);
canvas.addEventListener("mousemove", seguirDibujo);
window.addEventListener("mouseup", terminarDibujo);
canvas.addEventListener("touchstart", empezarDibujo, { passive: false });
canvas.addEventListener("touchmove", seguirDibujo, { passive: false });
canvas.addEventListener("touchend", terminarDibujo);

document.querySelectorAll("#toolbar button[data-tool]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#toolbar button[data-tool]").forEach(b => b.classList.remove("activo"));
    btn.classList.add("activo");
    herramienta = btn.dataset.tool;
  });
});

document.getElementById("btnDeshacer").addEventListener("click", () => { formas.pop(); redibujar(); });
document.getElementById("btnLimpiar").addEventListener("click", () => { formas = []; redibujar(); });
document.getElementById("btnGuardar").addEventListener("click", () => {
  enviarValor(canvas.toDataURL("image/png"));
  estadoEl.textContent = "✅ Anotación guardada";
});

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  canvas.width = args.ancho || 600;
  canvas.height = args.alto || 350;
  ajustarAltura(canvas.height + 90);

  if (args.imagen_base64) {
    const img = new Image();
    img.onload = () => { imagenFondo = img; redibujar(); };
    img.src = args.imagen_base64;
  } else {
    redibujar();
  }
});

marcarListo();
ajustarAltura(410);
redibujar();
</script>
</body>
</html>
